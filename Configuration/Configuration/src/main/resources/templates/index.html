<!DOCTYPE html>
<html :class="{ 'theme-dark': dark }" x-data="data()" lang="en" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/backOffice/public/assets/img/favicon.ico}">
    <title>Spring Boot - Go Trip </title>
    <link rel="stylesheet" th:href="@{/backOffice/public/assets/css/tailwind.output.css}" />
    <script th:src="@{/backOffice/public/assets/js/init-alpine.js}"></script>
  </head>
  <body>
    <div class="flex items-center min-h-screen p-6 bg-gray-50 dark:bg-gray-900">
      <div
        class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-lg shadow-xl dark:bg-gray-800"
      >
        <div class="flex flex-col overflow-y-auto md:flex-row">
          <div class="h-32 md:h-auto md:w-1/2">
            <img
              aria-hidden="true"
              class="object-cover w-full h-full dark:hidden"
              th:src="@{/backOffice/public/assets/img/login-office.jpeg}"
              alt="Office"
            />
            <img
              aria-hidden="true"
              class="hidden object-cover w-full h-full dark:block"
              th:src="@{/backOffice/public/assets/img/login-office-dark.jpeg}"
              alt="Office"
            />
          </div>
          <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
            <form class="w-full" method="post" th:action="@{/login}">
              <h1 class="mb-4 text-xl font-semibold text-gray-700 dark:text-gray-200">Spring Boot Login</h1>
              <label class="block text-sm">
                <span class="text-gray-700 dark:text-gray-400">Pseudo</span>
                <input     th:class="${errorPseudo} ? 
                'block w-full mt-1 text-sm border-red-600 dark:text-gray-300 dark:bg-gray-700 focus:border-red-400 focus:outline-none focus:shadow-outline-red form-input' : 
                'block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input'"
                placeholder="Jane Doe" name="pseudo" th:value="${pseudo}"/>
                <span th:if="${errorPseudo}" th:text="${errorPseudo}" class="text-xs text-red-600 dark:text-red-400"></span>
              </label>
              <label class="block mt-4 text-sm">
                <span class="text-gray-700 dark:text-gray-400">Password</span>
                <input th:class="${errorMdp} ? 
                'block w-full mt-1 text-sm border-red-600 dark:text-gray-300 dark:bg-gray-700 focus:border-red-400 focus:outline-none focus:shadow-outline-red form-input' : 
                'block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input'"
                 placeholder="***************" type="password" name="mdp" th:value="${mdp}"/>
                <span th:if="${errorMdp}" th:text="${errorMdp}" class="text-xs text-red-600 dark:text-red-400"></span>
              </label>

              <!-- You should use a button here, as the anchor is only used for the example  -->
              <input
                class="block w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple"
                type="submit"
                value="Se connecter"
              >
              <hr class="my-8" />
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
